<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>simplyZOMBIES — attention field spike</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: #0a0a0c; overflow: hidden;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #c9c9d1;
      }
      #wrap { position: relative; width: 100vw; height: 100vh; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .panel {
        position: absolute; background: rgba(10,10,14,.82); border: 1px solid #2a2a33;
        padding: 8px 11px; border-radius: 5px; pointer-events: none; white-space: pre;
      }
      #hud { top: 10px; left: 10px; }
      #help { bottom: 10px; left: 10px; color: #8a8a95; }
      #verdict { top: 10px; right: 10px; max-width: 260px; white-space: normal; color: #8a8a95; }
      b { color: #e8e8ef; font-weight: 600; }
      .hot { color: #ff8a6b; }
      .ok { color: #7fd4a0; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div class="panel" id="hud"></div>
      <div class="panel" id="help"></div>
      <div class="panel" id="verdict"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
