name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Three projects: the main build, the sim/ purity gate (compiled without the DOM
      # lib, so DOM access in sim/ is a type error), and the throwaway spike.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Includes the determinism test, which is the whole point of the kernel.
      - name: Test
        run: npm test
