name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled rather than left to finish. Pushing a fix while the previous
# commit's run is still going should not leave two runs competing to report on the branch --
# and it means a job that has genuinely hung stops the moment a fix is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Headless engine only. Windows/web packaging lives in godot-exports, which installs
  # the export templates this job never has.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .ci-tools/godot
          key: godot-4.7.1-${{ runner.os }}-standard

      # Pin the exact engine used by the rebuild. Download from Godot's official release and
      # verify the release checksum before any project script executes it.
      - name: Install Godot 4.7.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-tools/godot
          cd .ci-tools/godot
          curl --fail --location --http1.1 --retry 5 --retry-all-errors --retry-delay 2 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9  godot.zip" | sha512sum --check
          unzip -q godot.zip
          rm godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Configure Godot
        shell: bash
        run: echo "GODOT_BIN=$PWD/.ci-tools/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      # Two projects: the main build, and the sim/ purity gate (compiled without the DOM
      # lib, so DOM access in sim/ is a type error rather than a review comment).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Correctness: unit, determinism, module isolation, save/load, and the Milestone 0
      # and 1 exit criteria.
      - name: Test
        run: npm test

      - name: Godot R1 parity
        run: npm run godot:test

      - name: Godot project smoke
        run: npm run godot:smoke

      - name: Godot content validation
        run: npm run godot:validate

      - name: Godot headless bench (R5 candidate packaging gate)
        run: npm run godot:bench

      - name: R6 per-tick parity (every tick, not end-state)
        run: npm run godot:r6:ticks

      - name: R6 coverage (isolation/save/content/determinism/acceptance)
        run: npm run godot:r6:coverage

      - name: R6 mutation (determinism/content/deploy/perf gates sensitive)
        run: npm run godot:r6:mutation

      - name: R6 soak (memory/save/input/pause/tab)
        run: npm run godot:r6:soak

      - name: M2 lethality (stages/armor/diagnosis/amputate/turning)
        run: npm run godot:m2

  godot-exports:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Godot
        id: godot-windows-cache
        uses: actions/cache@v4
        with:
          path: .ci-tools/godot
          key: godot-4.7.1-${{ runner.os }}-standard

      - name: Install Godot 4.7.1
        if: steps.godot-windows-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .ci-tools/godot -Force | Out-Null
          $archive = Resolve-Path .ci-tools/godot | Join-Path -ChildPath godot.zip
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip -OutFile $archive
          $expected = "a6b02c527c18ba9936e63562032701432b2dc57d98d6483ceaccb00fe14af16af5773ae8a55e7b4d614edf121c4d9e420d870f804edb1dac16362298a01ce6c4"
          if ((Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant() -ne $expected) { throw "Godot checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath .ci-tools/godot
          Remove-Item -LiteralPath $archive

      - name: Configure Godot
        shell: pwsh
        run: |
          $godot = Resolve-Path .ci-tools/godot/Godot_v4.7.1-stable_win64.exe
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Godot export templates
        id: template-cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.7.1.stable
          key: godot-4.7.1-${{ runner.os }}-web-windows-release-templates

      - name: Install release export templates
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP export-templates.tpz
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz -OutFile $archive
          $expected = "afcc83d8d3d298038f19c58744a0d660fa75dd4baa33cb55d1011bb2565a2a8c2381728924564cb909e37c205a23f21b521b23bd057993afd43ae4da0b2f9d47"
          if ((Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant() -ne $expected) { throw "Template checksum mismatch" }
          $destination = Join-Path $env:APPDATA Godot/export_templates/4.7.1.stable
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $wanted = @(
            "templates/version.txt",
            "templates/web_nothreads_release.zip",
            "templates/web_release.zip",
            "templates/windows_release_x86_64.exe",
            "templates/windows_release_x86_64_console.exe"
          )
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($name in $wanted) {
              $entry = $zip.GetEntry($name)
              if ($null -eq $entry) { throw "Missing template entry: $name" }
              $target = Join-Path $destination ([System.IO.Path]::GetFileName($entry.FullName))
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $false)
            }
          } finally {
            $zip.Dispose()
          }

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium

      - name: Export Godot candidates
        run: npm run godot:export

      - name: Boot Windows and web exports
        run: npm run godot:smoke:exports

      - uses: actions/upload-artifact@v4
        with:
          name: godot-r1-windows-web
          path: dist-godot/
          if-no-files-found: error
          retention-days: 7

  # Separated from `check` so a timing wobble reports as a performance problem rather than
  # as a broken build, and so the correctness suite is never waiting on a browser download.
  performance:
    runs-on: ubuntu-latest
    # The frame benchmark drives a real browser, which is the one step here that can hang
    # rather than fail. Without a cap it sits until GitHub's six-hour default and reports
    # nothing; the harness has its own deadlines, and this is the backstop behind them.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # docs/00-vision.md pillar 6: exceeding a budget fails the build, at the same
      # severity as a failing test. "A feature that breaks budget does not ship until it
      # is fixed."
      - name: Tick budgets
        run: npm run bench

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Frame time cannot be measured headlessly in node, and the spike measured draw at
      # ~30x sim cost -- so a tick-only budget would catch nothing.
      # See docs/22-performance.md#aim-the-budgets-at-the-renderer.
      - name: Frame budget
        run: npm run bench:frame
